<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block page_title %}Wumpus{% endblock %}</title>
    <link rel="icon" href="{{url_for('static', filename='assets/wumpus-discord.png')}}" />
    <link rel="stylesheet" href="{{url_for('static', filename='css/common.css')}}" />
    {% block add_css_js %} {% endblock %}
</head>
<body>
    <div id="sidebar">
        <header>
            <h1><a href="/">Hunt the Wumpus</a></h1>
            <br>
            <hr>
            <div>
                <a href="/menu" {% block class_home %} {% endblock %}>Home</a>
                <a href="/play" {% block class_play %} {% endblock %}>Play</a>
                <a href="/stats" {% block class_stats %} {% endblock %}>Stats</a>
                {% if 'user_id' in session %}
                    <a href="/profile" {% block class_profile %} {% endblock %}>Profile</a>
                    <a href="/logout" class="user-disconnect-link">
                        <span class="user-state">
                            {{ session.get('username') }}
                            <br>
                            {% if user and user.icon %}
                                <img src="data:image/png;base64,{{ user.icon }}" alt="Supposed to be your icon." width="44" height="44" style="image-rendering: pixelated" >
                            {% endif %}
                        </span>
                        <span class="disconnect-state">DISCONNECT</span>
                    </a>
                {% endif %}
            </div>
        </header>

        <main>
            {% block main_content %}
            <div id="functional">
                <h1><a href="/">EREEUR 404</a></h1>
                <br>
                <img src="{{url_for('static', filename='assets/wumpus-discord.png')}}">
                <br>
                <h1><a href="/">Retourner à l'acceuil</a></h1>
            </div>
            {% endblock %}
        </main>
    </div>

    <!-- <footer>
    </footer> -->
</body>
</html>
